version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=saftehnika
      - POSTGRES_USER=saftehnika_user
      - POSTGRES_PASSWORD=saftehnika_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saftehnika_user -d saftehnika"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  api:
    build:
      context: ./django
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 60 --access-logfile - --error-logfile - config.wsgi:application"
    volumes:
      - ./django:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=change-this-in-production
      - DATABASE_URL=postgresql://saftehnika_user:saftehnika_pass@db:5432/saftehnika
      - ALLOWED_HOSTS=localhost,127.0.0.1,api
      - CORS_ALLOWED_ORIGINS=http://localhost:3002
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./vue
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  app-network:
    driver: bridge
